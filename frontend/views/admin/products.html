<section class="panel product-manager">
  <div class="panel-title">
    <div>
      <h2>Products</h2>
      <p>Add and edit rice products available in the store.</p>
    </div>
    <button class="button" type="button" data-product-form-toggle>+ Add rice</button>
  </div>

  <form class="product-form" id="product-form" hidden>
    <h3>Rice details</h3>
    <div class="product-form-grid">
      <label>Product name<input name="name" required maxlength="100" placeholder="e.g. Sinandomeng"></label>
      <label>Category<select name="type" required>
          <option value="Regular">Regular</option>
          <option value="Well Milled">Well Milled</option>
          <option value="Premium">Premium</option>
        </select></label>
      <label>Price (₱)<input name="price" type="number" min="1" step="0.01" required placeholder="42"></label>
      <label>Unit<select name="weight" required>
          <option value="per kg">Per kg</option>
          <option value="per sack">Per sack</option>
        </select></label>
      <label class="product-image-field">Product picture<input name="image" type="file" accept="image/*"><small>Optional
          · image up to 5 MB</small></label>
      <div class="product-image-preview" id="product-image-preview">Picture preview</div>
    </div>
    <div class="product-form-actions"><button class="button" type="submit">Save rice</button><button class="text-button"
        type="button" data-product-form-toggle>Cancel</button></div>
    <p class="product-form-message" id="product-form-message" role="alert"></p>
  </form>

  <div class="table-wrap">
    <table class="product-admin-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Unit</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="admin-product-list"></tbody>
    </table>
  </div>
</section>
