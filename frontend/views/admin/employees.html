<section class="panel employee-directory">
  <div class="panel-title">
    <div>
      <h2>Employees</h2>
      <p>Add and manage your employee directory.</p>
    </div>
    <button class="button" type="button" data-employee-form-toggle>+ Add employee</button>
  </div>

  <form class="employee-form" id="employee-form" hidden>
    <h3>Employee details</h3>
    <div class="employee-form-grid">
      <label>Full name<input name="name" required maxlength="100" placeholder="e.g. Maria Reyes"></label>
      <label>Position<input name="position" maxlength="80" placeholder="e.g. Store Staff"></label>
      <label>Birthday<input name="birthday" type="date" required></label>
      <label>Age<input name="age" type="number" readonly placeholder="Auto-calculated from birthday"></label>
      <label class="employee-photo-field">Employee picture<input name="picture" type="file"
          accept="image/*"><small>Optional · image up to 5 MB</small></label>
      <div class="employee-photo-preview" id="employee-photo-preview" aria-live="polite">Picture preview</div>
    </div>
    <div class="employee-form-actions"><button class="button" type="submit">Save employee</button><button
        class="text-button" type="button" data-employee-form-toggle>Cancel</button></div>
    <p class="employee-form-message" id="employee-form-message" role="alert"></p>
  </form>

  <div class="table-wrap">
    <table class="employee-table">
      <thead>
        <tr>
          <th>Employee</th>
          <th>Position</th>
          <th>Birthday</th>
          <th>Age</th>
          <th>Time in</th>
          <th>Time out</th>
          <th>Attendance</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="employee-list"></tbody>
    </table>
  </div>
</section>
